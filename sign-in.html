<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-in and Booking</title>

    <style>
      body {
        font-family: Arial;
        margin: 20px;
      }

      nav {
        background-color: black;
        padding: 15px;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin-right: 15px;
      }

      h1 {
        text-align: center;
      }

      form {
        background-color: blue;
        color: white;
        max-width: 500px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 12px;
      }

      fieldset {
        border: 2px solid white;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-top: 10px;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }

      button {
        background-color: black;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
      }

      footer {
        background-color: black;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="accept.html">Services</a>
      <a href="records.html">Records</a>
      <a href="status.html">Status</a>
    </nav>

    <h1>Sign in and book a visit</h1>

    <form action="landingpage.html" method="get">
      <fieldset>
        <legend>Owner details</legend>

        <label for="fname">First name</label>
        <input
          type="text"
          id="fname"
          name="fname"
          placeholder="Your first name"
          required
        />

        <label for="lname">Last name</label>
        <input
          type="text"
          id="lname"
          name="lname"
          placeholder="Your last name"
          required
        />

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Your email"
          required
        />

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="0700 000 000" />
      </fieldset>

      <fieldset>
        <legend>Animal details</legend>

        <label for="aname">Animal name</label>
        <input type="text" id="aname" name="aname" placeholder="e.g. Simba" />

        <label for="type">Animal type</label>
        <select id="type" name="type">
          <option>Dog</option>
          <option>Cat</option>
          <option>Cattle</option>
          <option>Sheep</option>
          <option>Pig</option>
          <option>Poultry</option>
          <option>Horse</option>
        </select>

        <label for="age">Age (years)</label>
        <input type="number" id="age" name="age" min="0" />
      </fieldset>

      <fieldset>
        <legend>Appointment details</legend>

        <label for="service">Service</label>
        <select id="service" name="service">
          <option>Surgery</option>
          <option>Deworming</option>
          <option>Vaccination</option>
          <option>Consultation</option>
          <option>Dental Cleaning</option>
          <option>Emergency Care</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" />

        <label for="time">Time</label>
        <input type="time" id="time" name="time" />

        <label for="notes">Notes</label>
        <textarea
          id="notes"
          name="notes"
          rows="3"
          placeholder="Anything the vet should know"
        ></textarea>
      </fieldset>

      <button type="submit">Proceed</button>
    </form>

    <footer>
      <p>Vet-Connect | Nairobi, Kenya</p>
      <p>Phone: +254 700 000 000 | Email: info@vetconnect.co.ke</p>
      <p>&copy; Vet-Connect company ltd</p>
    </footer>
  </body>
</html>
